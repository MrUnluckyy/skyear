# SkyEar agent config. Copy to config.yaml and edit.

adsb:
  # A single name is the preferred source, not an exclusive one: the other free
  # APIs stay behind it as fallbacks, because any one of them sheds load
  # unpredictably (measured 2026-09-23 at a 10 s poll: adsb.lol shed 17% of
  # requests, adsb.fi none). Write a list to pin the rotation: [adsb.fi]
  provider: adsb.fi         # adsb.fi | adsb.lol | airplanes.live | readsb
  # airplanes.live closed its open API - it 403s until you are granted access
  # by mailing contact@airplanes.live. readsb is your own receiver and never
  # falls back to a public API:
  # readsb_url: http://raspberrypi.local/tar1090/data/aircraft.json
  poll_seconds: 10          # these APIs allow ~1 req/s; 10 s is polite and plenty
  rate_limit_backoff_s: 60  # cap after a 429 - load shedding clears in seconds
  max_backoff_s: 300        # cap after a network failure, which does not
  radius_nm: 15             # ~28 km around the first camera
  # lat/lon default to the first camera

cameras:
  - id: home-1
    type: reolink           # reolink | hikvision | dahua | ubiquiti | generic
    host: 192.168.1.50
    port: 554
    channel: 1
    stream: sub             # sub is enough: same audio, less bandwidth
    username: admin
    password_env: CAM1_PASSWORD
    lat: 54.6872            # exact camera position (stays on this device)
    lon: 25.2797
    elevation_m: 120        # ground elevation above sea level
    mount_height_m: 4

detector:
  band_hz: [50, 2000]
  threshold_db: 8           # dB above rolling noise floor to trigger
  release_db: 4
  min_duration_s: 4         # aircraft are long; ignores doors, dogs, claps
  release_s: 3
  max_event_s: 240
  floor_window_s: 180
  floor_percentile: 20
  warmup_s: 30
  wind_tilt_db: 20          # 50-100 Hz minus 200-400 Hz above this = wind, not aircraft
  harmonic_cpp_db: 0.12     # periodicity above this = an engine, not noise

matching:
  max_range_m: 12000        # aircraft further than this are not linked to a sound
  pass_radius_m: 8000       # every aircraft closer than this gets a heard/not-heard record
  max_fix_age_s: 60         # ignore ADS-B fixes older than this (parked transponders)
  track_ground: false       # surface traffic is not an aircraft pass
  reopen_cooldown_s: 120    # stops one pass splitting into duplicates across an ADS-B gap

# UniFi Protect works differently from the others. Enable RTSP per camera in
# Protect (Settings -> Advanced -> RTSP), copy the stream URL it shows, and take
# the token from the end of the path. There is no username or password: that
# token is the credential, so it goes in .env.
#
#  - id: gate
#    type: ubiquiti
#    host: 192.168.1.1          # the NVR / UDM, not the camera
#    password_env: CAM2_STREAM  # the token from the Protect URL
#
# Anything else that neither builder handles can supply a whole URL instead:
#
#  - id: odd-one
#    url_env: CAM3_URL          # the complete rtsp:// or rtsps:// URL

clips:
  save: true                # clips stay on this device
  pre_roll_s: 5
  keep_days: 14

cloud:
  # Leave url unset to keep everything on this device.
  url: https://kzeghlzmbxeldrmoxdrl.supabase.co
  device_name: home-nas
  upload_interval_s: 10      # also the liveness heartbeat for the map
