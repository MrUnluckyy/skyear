name: agent tests

on:
  push:
    paths: ["agent/**", ".github/workflows/agent-tests.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because contributors run whatever their NAS ships.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - run: pip install -r agent/requirements-dev.txt
      - run: python -m pytest
        working-directory: agent
