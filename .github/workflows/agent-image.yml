name: agent image

# Contributors run this on a Synology (x86-64), a Raspberry Pi (arm64), or as a
# Home Assistant add-on. Two tagging schemes come out of one build:
#
#   skyear-agent            multi-arch manifest, for docker run / compose
#   skyear-agent-aarch64    single-arch tags, which Home Assistant add-ons
#   skyear-agent-amd64      require - they substitute {arch} rather than
#                           relying on a manifest list.
#
# No armv7. numpy publishes no wheel for 32-bit ARM, so pip falls back to
# compiling it from source in an image with no compiler. That covers only Pi 2
# and 32-bit Pi OS; even a Pi Zero 2 W runs 64-bit, which is aarch64.
on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-agent
          tags: |
            type=match,pattern=agent-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Home Assistant substitutes {arch} into the image name and pulls that tag
  # directly, so each architecture needs its own repository.
  per-arch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
          - ha_arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-agent-${{ matrix.ha_arch }}
          tags: |
            type=match,pattern=agent-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
